<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플래시카드 | 소득세법</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .flashcard-wrap{perspective:1000px;margin:10px 0;}
    .flashcard-inner{position:relative;width:100%;min-height:220px;transition:transform 0.5s;transform-style:preserve-3d;cursor:pointer;}
    .flashcard-inner.flipped{transform:rotateY(180deg);}
    .card-face{position:absolute;width:100%;min-height:220px;border-radius:16px;padding:28px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.1);}
    .card-front{background:white;border:2px solid #C5E1A5;}
    .card-back{background:#E8F5E9;border:2px solid #2E7D32;transform:rotateY(180deg);}
    .card-front .term{font-size:1.4rem;font-weight:bold;color:#1B5E20;line-height:1.5;}
    .card-back .meaning{font-size:0.95rem;color:#1B5E20;line-height:1.8;white-space:pre-line;}
    .card-back .source{font-size:0.75rem;color:#888;margin-top:10px;border-top:1px solid #C5E1A5;padding-top:8px;width:100%;text-align:center;}
    .flip-hint{font-size:0.75rem;color:#AAA;margin-top:12px;}
    .card-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0;}
    .btn-prev,.btn-next-card{flex:1;padding:12px;border:none;border-radius:10px;font-size:0.9rem;font-weight:bold;font-family:inherit;cursor:pointer;color:white;}
    .btn-prev{background:#546E7A;} .btn-next-card{background:#1B5E20;}
    .btn-prev:disabled,.btn-next-card:disabled{background:#BDBDBD;cursor:default;}
    .know-wrap{display:flex;gap:10px;margin:8px 0 14px;}
    .btn-know{flex:1;padding:13px;border:none;border-radius:10px;font-size:0.9rem;font-weight:bold;font-family:inherit;cursor:pointer;color:white;}
    .btn-know.yes{background:#2E7D32;} .btn-know.no{background:#E53935;}
  </style>
</head>
<body>

<div class="header">
  <h1>🃏 플래시카드</h1>
  <div class="sub" id="headerSub">챕터를 선택하세요</div>
</div>

<div class="container" id="quizPage">
  <div class="info-bar">
    <div>
      <span class="type-badge" id="typeBadge" style="background:#E65100;">플래시카드</span>
      <span id="progressText" style="margin-left:6px; font-size:0.85rem;"></span>
    </div>
    <div id="knowScore" style="font-size:0.85rem; color:#555;">✅ 0 / ❌ 0</div>
  </div>
  <div style="display:flex;justify-content:space-between;font-size:0.78rem;color:#888;margin-bottom:3px;">
    <span>진행</span><span id="progressPct">0%</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%; background:#E65100;"></div>
  </div>
  <div style="text-align:center;font-size:0.85rem;color:#888;margin-bottom:6px;" id="cardCounter"></div>
  <div class="flashcard-wrap">
    <div class="flashcard-inner" id="flashcardInner" onclick="flipCard()">
      <div class="card-face card-front"><div class="term" id="cardFront">카드를 불러오는 중...</div><div class="flip-hint">👆 탭하여 뒤집기</div></div>
      <div class="card-face card-back"><div class="meaning" id="cardBack"></div><div class="source" id="cardSource"></div></div>
    </div>
  </div>
  <div class="know-wrap" id="knowWrap" style="display:none;">
    <button class="btn-know yes" onclick="markKnow(true)">✅ 알고 있어요</button>
    <button class="btn-know no"  onclick="markKnow(false)">❌ 모르겠어요</button>
  </div>
  <div class="card-nav">
    <button class="btn-prev" id="btnPrev" onclick="prevCard()" disabled>◀ 이전</button>
    <button class="btn-next-card" id="btnNextCard" onclick="nextCard()">다음 ▶</button>
  </div>
  <div class="bottom-btns">
    <button class="btn-change" onclick="shuffleCards()">🔀 섞기</button>
    <button class="btn-change" onclick="showModal()">챕터 변경</button>
    <button class="btn-change" style="background:#546E7A;" onclick="location.href='index.html'">🏠 홈</button>
  </div>
</div>

<div class="container" id="resultPage" style="display:none;">
  <div class="card"><div class="card-title">🎉 플래시카드 완료!</div><div id="resultContent"></div></div>
  <div class="bottom-btns">
    <button class="btn-next" onclick="retryAll()">🔄 전체 다시</button>
    <button class="btn-next" style="background:#E53935;" onclick="retryWrong()">❌ 모르는 것만</button>
    <button class="btn-change" onclick="showModal()">📚 챕터 변경</button>
    <button class="btn-change" style="background:#546E7A;" onclick="location.href='index.html'">🏠 홈</button>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2>📚 챕터 선택</h2>
    <div id="modalChGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    <div style="margin-top:14px; border-top:1px solid #E0E0E0; padding-top:12px;">
      <button onclick="startAllChapters()" style="width:100%; padding:13px; background:#1B5E20; color:white; border:none; border-radius:10px; font-size:0.9rem; font-weight:bold; font-family:inherit; cursor:pointer;">🎲 전체 챕터 랜덤</button>
    </div>
  </div>
</div>

<script src="data/ch01.js"></script>
<script src="data/ch02.js"></script>
<script src="data/ch03.js"></script>
<script src="data/ch04.js"></script>
<script src="data/ch05.js"></script>
<script src="data/ch06.js"></script>
<script src="data/ch07.js"></script>
<script src="data/ch08.js"></script>
<script src="data/ch09.js"></script>
<script src="data/ch10.js"></script>
<script src="data/ch11.js"></script>
<script src="app.js"></script>
<script>
let cards=[],idx=0,knownCount=0,unknownCount=0,unknownCards=[],isFlipped=false,currentChKey='';

function init(){
  const ch=sessionStorage.getItem('sel_ch'),type=sessionStorage.getItem('sel_type');
  if(ch&&type==='card')startChapter(ch);else showModal();
}

function buildModal(){
  const grid=document.getElementById('modalChGrid');grid.innerHTML='';
  const colors=['#E53935','#D81B60','#7B1FA2','#1565C0','#00838F','#2E7D32','#F57F17','#4E342E','#37474F','#B71C1C','#546E7A'];
  CHAPTER_LIST.forEach((ch,i)=>{
    const data=getTypeData(ch.key,'cards');if(!data.length)return;
    const btn=document.createElement('button');
    btn.style.cssText=`padding:12px 8px;border:none;border-radius:10px;background:${colors[i]};color:white;font-size:0.82rem;font-weight:bold;font-family:inherit;cursor:pointer;line-height:1.4;`;
    btn.innerHTML=`CH${i+1} ${ch.label.replace(/CH\d+\s*/,'')}<br><span style="font-size:0.7rem;opacity:0.85;">${data.length}장</span>`;
    btn.onclick=()=>{closeModal();startChapter(ch.key);};grid.appendChild(btn);
  });
}

function showModal(){buildModal();document.getElementById('modal').classList.add('active');}
function closeModal(){document.getElementById('modal').classList.remove('active');}

function startChapter(chKey){
  currentChKey=chKey;
  const raw=getTypeData(chKey,'cards');if(!raw.length){showToast('카드가 없습니다');return;}
  cards=shuffle(raw);resetSession();
  const ch=getChData(chKey);
  document.getElementById('headerSub').textContent=ch?ch.title:chKey;
  document.getElementById('quizPage').style.display='block';
  document.getElementById('resultPage').style.display='none';
  loadCard();
}

function startAllChapters(){
  closeModal();currentChKey='ALL';let all=[];
  CHAPTER_LIST.forEach(ch=>{all=all.concat(getTypeData(ch.key,'cards').map(c=>({...c,_chKey:ch.key})));});
  if(!all.length){showToast('카드가 없습니다');return;}
  cards=shuffle(all);resetSession();
  document.getElementById('headerSub').textContent='전체 챕터 랜덤';
  document.getElementById('quizPage').style.display='block';
  document.getElementById('resultPage').style.display='none';
  loadCard();
}

function resetSession(){idx=0;knownCount=0;unknownCount=0;unknownCards=[];isFlipped=false;}

function loadCard(){
  isFlipped=false;
  const card=cards[idx],t=cards.length;
  document.getElementById('progressText').textContent=`${idx+1} / ${t}`;
  document.getElementById('progressBar').style.width=`${((idx+1)/t)*100}%`;
  document.getElementById('progressPct').textContent=`${Math.round(((idx+1)/t)*100)}%`;
  document.getElementById('cardCounter').textContent=`카드 ${idx+1} / ${t}`;
  document.getElementById('knowScore').textContent=`✅ ${knownCount} / ❌ ${unknownCount}`;
  document.getElementById('cardFront').textContent=card.front;
  document.getElementById('cardBack').textContent=card.back;
  document.getElementById('cardSource').textContent=card.원문?`📌 원문: ${card.원문}`:'';
  document.getElementById('flashcardInner').classList.remove('flipped');
  document.getElementById('knowWrap').style.display='none';
  document.getElementById('btnPrev').disabled=(idx===0);
  document.getElementById('btnNextCard').disabled=false;
}

function flipCard(){
  const inner=document.getElementById('flashcardInner');isFlipped=!isFlipped;
  if(isFlipped){inner.classList.add('flipped');document.getElementById('knowWrap').style.display='flex';}
  else{inner.classList.remove('flipped');document.getElementById('knowWrap').style.display='none';}
}

function markKnow(knows){
  if(knows)knownCount++;
  else{unknownCount++;unknownCards.push(cards[idx]);}
  document.getElementById('knowScore').textContent=`✅ ${knownCount} / ❌ ${unknownCount}`;
  nextCard();
}

function nextCard(){if(idx+1>=cards.length)showResult();else{idx++;loadCard();}}
function prevCard(){if(idx>0){idx--;loadCard();}}
function shuffleCards(){cards=shuffle(cards);resetSession();loadCard();showToast('🔀 카드를 섞었습니다!');}

function showResult(){
  document.getElementById('quizPage').style.display='none';
  document.getElementById('resultPage').style.display='block';
  const total=knownCount+unknownCount,pct=total>0?Math.round(knownCount/total*100):0;
  const chLabel=getChData(currentChKey)?.title||(currentChKey==='ALL'?'전체 챕터':currentChKey);
  let msg=pct>=90?'🏆 거의 다 외웠어요!':pct>=70?'👍 잘 하셨어요!':'📖 모르는 카드를 다시 봐요!';
  let unknownHTML='';
  if(unknownCards.length>0){
    unknownHTML=`<div style="font-weight:bold;color:#B71C1C;margin:14px 0 8px;">❌ 모르는 카드 (${unknownCards.length}장)</div>`;
    unknownCards.forEach((c,i)=>{unknownHTML+=`<div class="wrong-item"><div class="wi-q" style="font-size:1rem;color:#1B5E20;">${c.front}</div><div class="wi-exp" style="margin-top:6px;">${c.back}</div>${c.원문?`<div style="font-size:0.75rem;color:#888;margin-top:3px;">📌 원문: ${c.원문}</div>`:''}</div>`;});
  }
  document.getElementById('resultContent').innerHTML=`<div style="text-align:center;margin-bottom:14px;"><div style="font-size:0.9rem;color:#555;">${chLabel}</div><div style="font-size:2rem;font-weight:bold;color:#1B5E20;margin:6px 0;">✅ ${knownCount}  /  ❌ ${unknownCount}</div><div style="font-size:1rem;color:#555;">암기율 ${pct}% (총 ${cards.length}장)</div><div style="font-size:1.1rem;font-weight:bold;color:#E65100;margin-top:4px;">${msg}</div></div>${unknownHTML}`;
  window.scrollTo(0,0);
}

function retryAll(){if(currentChKey==='ALL')startAllChapters();else startChapter(currentChKey);}
function retryWrong(){if(!unknownCards.length){showToast('모르는 카드가 없습니다! 🎉');return;}cards=shuffle([...unknownCards]);resetSession();document.getElementById('quizPage').style.display='block';document.getElementById('resultPage').style.display='none';loadCard();}
init();
</script>
</body>
</html>
