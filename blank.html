<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빈칸 채우기 | 소득세법</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>✏️ 빈칸 채우기</h1>
  <div class="sub" id="headerSub">챕터를 선택하세요</div>
</div>

<div class="container" id="quizPage">
  <div class="info-bar">
    <div>
      <span class="type-badge" id="typeBadge" style="background:#1565C0;">빈칸 채우기</span>
      <span id="progressText" style="margin-left:6px; font-size:0.85rem;"></span>
    </div>
    <div id="scoreText" style="font-size:0.85rem; color:#555;">점수: 0 / 0</div>
  </div>
  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar" style="width:0%; background:#1565C0;"></div>
  </div>
  <div class="question-box" id="questionBox">
    <span class="q-label" id="qLabel"></span>
    <span id="qText">챕터와 문제를 불러오는 중...</span>
  </div>
  <div id="blankWrap" style="display:flex; flex-direction:column; gap:10px; margin:10px 0;"></div>
  <button class="btn-save" id="btnCheck" onclick="checkAnswer()" style="background:#1565C0; margin-bottom:8px;">✅ 정답 확인</button>
  <div class="result-text" id="resultText"></div>
  <div class="explain-box" id="explainBox"></div>
  <div class="source-box" id="sourceBox"></div>
  <div class="bottom-btns">
    <button class="btn-next" id="btnNext" onclick="nextQuestion()" disabled>다음 ▶</button>
    <button class="btn-show-source" id="btnSource" onclick="toggleSource()" style="display:none;">📌 원문 보기</button>
    <button class="btn-change" onclick="showModal()">챕터 변경</button>
    <button class="btn-change" style="background:#546E7A;" onclick="location.href='index.html'">🏠 홈</button>
  </div>
</div>

<div class="container" id="resultPage" style="display:none;">
  <div class="card">
    <div class="card-title">🎉 빈칸 채우기 완료!</div>
    <div id="resultContent"></div>
  </div>
  <div class="bottom-btns">
    <button class="btn-next" onclick="retrySession()">🔄 다시 풀기</button>
    <button class="btn-change" onclick="showModal()">📚 챕터 변경</button>
    <button class="btn-change" style="background:#546E7A;" onclick="location.href='index.html'">🏠 홈</button>
  </div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2>📚 챕터 선택</h2>
    <div id="modalChGrid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    <div style="margin-top:14px; border-top:1px solid #E0E0E0; padding-top:12px;">
      <button onclick="startAllChapters()" style="width:100%; padding:13px; background:#1B5E20; color:white; border:none; border-radius:10px; font-size:0.9rem; font-weight:bold; font-family:inherit; cursor:pointer;">🎲 전체 챕터 랜덤</button>
    </div>
  </div>
</div>

<script src="data/ch01.js"></script>
<script src="data/ch02.js"></script>
<script src="data/ch03.js"></script>
<script src="data/ch04.js"></script>
<script src="data/ch05.js"></script>
<script src="data/ch06.js"></script>
<script src="data/ch07.js"></script>
<script src="data/ch08.js"></script>
<script src="data/ch09.js"></script>
<script src="data/ch10.js"></script>
<script src="data/ch11.js"></script>
<script src="app.js"></script>
<script>
let questions=[],idx=0,correct=0,total=0,wrongs=[],answered=false,currentChKey='',sourceVisible=false;

function init(){
  const ch=sessionStorage.getItem('sel_ch'),type=sessionStorage.getItem('sel_type');
  if(ch&&type==='blank')startChapter(ch);else showModal();
}

function buildModal(){
  const grid=document.getElementById('modalChGrid');grid.innerHTML='';
  const colors=['#E53935','#D81B60','#7B1FA2','#1565C0','#00838F','#2E7D32','#F57F17','#4E342E','#37474F','#B71C1C','#546E7A'];
  CHAPTER_LIST.forEach((ch,i)=>{
    const data=getTypeData(ch.key,'blank');if(!data.length)return;
    const btn=document.createElement('button');
    btn.style.cssText=`padding:12px 8px;border:none;border-radius:10px;background:${colors[i]};color:white;font-size:0.82rem;font-weight:bold;font-family:inherit;cursor:pointer;line-height:1.4;`;
    btn.innerHTML=`CH${i+1} ${ch.label.replace(/CH\d+\s*/,'')}<br><span style="font-size:0.7rem;opacity:0.85;">${data.length}문항</span>`;
    btn.onclick=()=>{closeModal();startChapter(ch.key);};grid.appendChild(btn);
  });
}

function showModal(){buildModal();document.getElementById('modal').classList.add('active');}
function closeModal(){document.getElementById('modal').classList.remove('active');}

function startChapter(chKey){
  currentChKey=chKey;
  const raw=getTypeData(chKey,'blank');if(!raw.length){showToast('빈칸 문제가 없습니다');return;}
  questions=shuffle(raw);idx=0;correct=0;total=0;wrongs=[];
  const ch=getChData(chKey);
  document.getElementById('headerSub').textContent=ch?ch.title:chKey;
  document.getElementById('quizPage').style.display='block';
  document.getElementById('resultPage').style.display='none';
  loadQuestion();
}

function startAllChapters(){
  closeModal();currentChKey='ALL';let all=[];
  CHAPTER_LIST.forEach(ch=>{all=all.concat(getTypeData(ch.key,'blank').map(q=>({...q,_chKey:ch.key})));});
  if(!all.length){showToast('문제가 없습니다');return;}
  questions=shuffle(all);idx=0;correct=0;total=0;wrongs=[];
  document.getElementById('headerSub').textContent='전체 챕터 랜덤';
  document.getElementById('quizPage').style.display='block';
  document.getElementById('resultPage').style.display='none';
  loadQuestion();
}

function loadQuestion(){
  answered=false;sourceVisible=false;
  const q=questions[idx],t=questions.length;
  const chKey=q._chKey||currentChKey;
  const chLabel=CHAPTER_LIST.find(c=>c.key===chKey)?.label||chKey;
  document.getElementById('progressText').textContent=`${idx+1} / ${t}`;
  document.getElementById('scoreText').textContent=`점수: ${correct} / ${total}`;
  document.getElementById('progressBar').style.width=`${(idx/t)*100}%`;
  document.getElementById('qLabel').textContent=chLabel;
  document.getElementById('qText').textContent=q.q;
  const wrap=document.getElementById('blankWrap');wrap.innerHTML='';
  q.answers.forEach((ans,i)=>{
    const div=document.createElement('div');
    div.style.cssText='display:flex;align-items:center;gap:8px;';
    div.innerHTML=`<span style="font-size:0.85rem;color:#1B5E20;font-weight:bold;width:24px;flex-shrink:0;">${i+1})</span><input type="text" class="blank-input" id="blank_${i}" placeholder="정답을 입력하세요" style="flex:1;" onkeydown="if(event.key==='Enter')checkAnswer()">`;
    wrap.appendChild(div);
  });
  document.getElementById('resultText').textContent='';
  document.getElementById('resultText').className='result-text';
  document.getElementById('explainBox').classList.remove('show');
  document.getElementById('sourceBox').classList.remove('show');
  document.getElementById('btnCheck').disabled=false;
  document.getElementById('btnNext').disabled=true;
  document.getElementById('btnSource').style.display='none';
  setTimeout(()=>{const f=document.getElementById('blank_0');if(f)f.focus();},100);
}

function checkAnswer(){
  if(answered)return;answered=true;
  const q=questions[idx],chKey=q._chKey||currentChKey;
  let allCorrect=true,myAnswers=[];
  q.answers.forEach((ans,i)=>{
    const input=document.getElementById(`blank_${i}`);
    const userVal=input?input.value.trim():'';myAnswers.push(userVal);
    const normalize=str=>str.replace(/\s/g,'').toLowerCase();
    const isOk=normalize(userVal)===normalize(ans);
    if(input){input.className=`blank-input ${isOk?'correct':'wrong'}`;input.disabled=true;if(!isOk){input.value=`${userVal}  →  정답: ${ans}`;allCorrect=false;}}
  });
  total++;
  if(allCorrect){correct++;document.getElementById('resultText').textContent='✅  정답입니다!';document.getElementById('resultText').className='result-text correct';}
  else{document.getElementById('resultText').textContent=`❌  오답!  정답: ${q.answers.join(' / ')}`;document.getElementById('resultText').className='result-text wrong';wrongs.push({...q,myAnswers});addWrongNote(chKey,'blank',q.q,myAnswers.join(' / '),q.answers.join(' / '),q.해설,q.원문);}
  updateProgress(chKey,'blank',allCorrect?1:0,1);
  const explainBox=document.getElementById('explainBox');explainBox.textContent=`📖 해설:  ${q.해설}`;explainBox.classList.add('show');
  if(q.원문){document.getElementById('btnSource').style.display='inline-block';document.getElementById('sourceBox').textContent=`📌 원문:  ${q.원문}`;}
  document.getElementById('btnCheck').disabled=true;
  document.getElementById('btnNext').disabled=false;
  document.getElementById('scoreText').textContent=`점수: ${correct} / ${total}`;
}

function toggleSource(){
  const box=document.getElementById('sourceBox');sourceVisible=!sourceVisible;
  if(sourceVisible){box.classList.add('show');document.getElementById('btnSource').textContent='📌 원문 닫기';}
  else{box.classList.remove('show');document.getElementById('btnSource').textContent='📌 원문 보기';}
}

function nextQuestion(){idx++;if(idx>=questions.length)showResult();else loadQuestion();}

function showResult(){
  document.getElementById('quizPage').style.display='none';
  document.getElementById('resultPage').style.display='block';
  const ch=getChData(currentChKey);
  const chLabel=ch?ch.title:(currentChKey==='ALL'?'전체 챕터':currentChKey);
  const pct=total>0?Math.round(correct/total*100):0;
  let msg=pct>=90?'🏆 훌륭합니다!':pct>=70?'👍 잘 하셨어요!':'📖 조금 더 복습해봐요!';
  let wrongHTML='';
  if(!wrongs.length)wrongHTML='<div style="text-align:center;color:#2E7D32;font-weight:bold;padding:14px;">🎊 모든 문제 정답!</div>';
  else{wrongHTML=`<div style="font-weight:bold;color:#B71C1C;margin:14px 0 8px;">❌ 틀린 문제 (${wrongs.length}개)</div>`;wrongs.forEach((w,i)=>{wrongHTML+=`<div class="wrong-item"><div class="wi-q">Q${i+1}. ${w.q}</div><div class="wi-ans"><span class="ans-my">내 답: ${w.myAnswers?.join(' / ')||'-'}</span><span class="ans-correct">정답: ${w.answers.join(' / ')}</span></div><div class="wi-exp">📖 ${w.해설}</div>${w.원문?`<div style="font-size:0.75rem;color:#888;margin-top:3px;">📌 원문: ${w.원문}</div>`:''}</div>`;});}
  document.getElementById('resultContent').innerHTML=`<div style="text-align:center;margin-bottom:14px;"><div style="font-size:0.9rem;color:#555;">${chLabel}</div><div style="font-size:2.2rem;font-weight:bold;color:#1B5E20;margin:6px 0;">${correct} / ${total}</div><div style="font-size:1rem;color:#555;">정답률 ${pct}%</div><div style="font-size:1.1rem;font-weight:bold;color:#E65100;margin-top:4px;">${msg}</div></div>${wrongHTML}`;
  window.scrollTo(0,0);
}

function retrySession(){if(currentChKey==='ALL')startAllChapters();else startChapter(currentChKey);}
init();
</script>
</body>
</html>
